name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Allure history
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          mkdir -p allure-history

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages

            if git show origin/gh-pages:allure-history/history.jsonl \
              > allure-history/history.jsonl 2>/dev/null; then
              echo "Previous Allure history restored."
            else
              echo "The gh-pages branch exists, but no history file was found."
            fi
          else
            echo "The gh-pages branch does not exist yet. The first report will start a new history."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run Playwright tests
        run: npm run test:allure

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Save Allure history in report
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        shell: bash
        run: |
          mkdir -p allure-report/allure-history
          cp allure-history/history.jsonl \
            allure-report/allure-history/history.jsonl

      - name: Upload Allure report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Allure report to gh-pages
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          full_commit_message: "ci: publish Allure report for ${{ github.sha }}"